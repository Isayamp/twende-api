<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1070" viewBox="0 0 1500 1070"><rect width="1500" height="1070" fill="#ffffff"/><text x="30" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1b2b36">Twende : diagramme de cas d'utilisation</text><rect x="240" y="60" width="1000" height="960" rx="10" fill="#fafbfc" stroke="#1f4e5f" stroke-width="2"/><line x1="144" y1="168" x2="290" y2="120" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="168" x2="290" y2="190" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="168" x2="290" y2="260" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="168" x2="290" y2="330" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="428" x2="290" y2="190" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="428" x2="290" y2="260" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="428" x2="290" y2="410" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="428" x2="290" y2="490" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="428" x2="290" y2="570" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="718" x2="290" y2="670" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="718" x2="290" y2="490" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="718" x2="290" y2="750" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="718" x2="550" y2="880" stroke="#44596a" stroke-width="1.2"/><line x1="144" y1="718" x2="290" y2="260" stroke="#44596a" stroke-width="1.2"/><line x1="1346" y1="408" x2="1150" y2="120" stroke="#44596a" stroke-width="1.2"/><line x1="1346" y1="408" x2="1150" y2="200" stroke="#44596a" stroke-width="1.2"/><line x1="1346" y1="408" x2="1150" y2="280" stroke="#44596a" stroke-width="1.2"/><line x1="1346" y1="408" x2="1150" y2="360" stroke="#44596a" stroke-width="1.2"/><line x1="1346" y1="408" x2="1150" y2="440" stroke="#44596a" stroke-width="1.2"/><line x1="1346" y1="408" x2="1150" y2="520" stroke="#44596a" stroke-width="1.2"/><line x1="1346" y1="408" x2="890" y2="880" stroke="#44596a" stroke-width="1.2"/><text x="740" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1f4e5f">Système Twende (API de transport et réservations)</text><ellipse cx="460" cy="120" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">S'inscrire</text><ellipse cx="460" cy="190" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Se connecter / se déconnecter</text><ellipse cx="460" cy="260" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Rechercher des trajets</text><ellipse cx="460" cy="330" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Voir les places libres d'un trajet</text><ellipse cx="460" cy="410" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Réserver une ou plusieurs places</text><ellipse cx="460" cy="490" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="495" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Annuler une réservation</text><ellipse cx="460" cy="570" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Consulter ses billets (numéro, QR code)</text><ellipse cx="460" cy="670" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="675" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Vendre des billets au guichet</text><ellipse cx="460" cy="750" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="460" y="755" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Marquer une réservation comme payée</text><ellipse cx="980" cy="120" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="980" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Gérer les stations</text><ellipse cx="980" cy="200" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="980" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Gérer les lignes et leurs arrêts</text><ellipse cx="980" cy="280" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="980" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Définir les tarifs par tronçon</text><ellipse cx="980" cy="360" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="980" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Gérer les véhicules</text><ellipse cx="980" cy="440" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="980" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Planifier ou annuler des trajets</text><ellipse cx="980" cy="520" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="980" y="525" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Gérer les utilisateurs et les rôles</text><ellipse cx="720" cy="880" rx="170" ry="24" fill="#fff" stroke="#1f4e5f" stroke-width="1.6"/><text x="720" y="885" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="middle" fill="#1b2b36">Voir les statistiques de remplissage</text><circle cx="120" cy="140" r="14" fill="none" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="154" x2="120" y2="196" stroke="#1b2b36" stroke-width="2"/><line x1="96" y1="168" x2="144" y2="168" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="196" x2="100" y2="228" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="196" x2="140" y2="228" stroke="#1b2b36" stroke-width="2"/><text x="120" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b2b36">Visiteur</text><circle cx="120" cy="400" r="14" fill="none" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="414" x2="120" y2="456" stroke="#1b2b36" stroke-width="2"/><line x1="96" y1="428" x2="144" y2="428" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="456" x2="100" y2="488" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="456" x2="140" y2="488" stroke="#1b2b36" stroke-width="2"/><text x="120" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b2b36">Passager</text><circle cx="120" cy="690" r="14" fill="none" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="704" x2="120" y2="746" stroke="#1b2b36" stroke-width="2"/><line x1="96" y1="718" x2="144" y2="718" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="746" x2="100" y2="778" stroke="#1b2b36" stroke-width="2"/><line x1="120" y1="746" x2="140" y2="778" stroke="#1b2b36" stroke-width="2"/><text x="120" y="802" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b2b36">Agent de guichet</text><circle cx="1370" cy="380" r="14" fill="none" stroke="#1b2b36" stroke-width="2"/><line x1="1370" y1="394" x2="1370" y2="436" stroke="#1b2b36" stroke-width="2"/><line x1="1346" y1="408" x2="1394" y2="408" stroke="#1b2b36" stroke-width="2"/><line x1="1370" y1="436" x2="1350" y2="468" stroke="#1b2b36" stroke-width="2"/><line x1="1370" y1="436" x2="1390" y2="468" stroke="#1b2b36" stroke-width="2"/><text x="1370" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1b2b36">Administrateur</text><text x="260" y="950" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5b6b78">Toute action sauf « S'inscrire » et « Rechercher » exige une connexion (jeton).</text><text x="260" y="972" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5b6b78">L'agent de guichet vend aussi pour des clients sans compte (passager saisi à la main).</text><text x="260" y="994" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5b6b78">Les droits sont contrôlés côté serveur : un passager ne voit que ses propres réservations.</text></svg>